name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh bootstrap.sh
      - run: node --check static/app.js
  wireguard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: v0.4.1
          path: previous
      - run: sudo bash wireguard/smoke.sh
  mac-client:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the signed package and check a second run
        run: |
          bash macos/install-sfm.sh --no-open
          bash macos/install-sfm.sh --no-open | grep 'already installed'
