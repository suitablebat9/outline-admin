name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh bootstrap.sh
      - run: node --check static/app.js
      - run: node --test tests/sharing.test.cjs
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash native/smoke-test.sh
  native-debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test Debian 12 with systemd and a container network
        run: |
          docker build -t vpn-bookworm - <<'DOCKER'
          FROM debian:12
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd iproute2 iptables openssl procps ca-certificates
          DOCKER
          docker run -d --name vpn --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock -e container=docker -v "$PWD:/src:ro" -w /src vpn-bookworm sh -ec 'mount -o remount,rw /sys/fs/cgroup && exec /lib/systemd/systemd'
          for i in {1..30}; do
            docker exec vpn test -S /run/systemd/private && break
            sleep 1
          done
          docker exec vpn bash native/smoke-test.sh
